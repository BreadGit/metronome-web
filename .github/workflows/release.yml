name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$TAG" =~ ^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$ ]]; then
            echo '::error::Expected vX.Y.Z or vX.Y.Z-prerelease (SemVer without build metadata).'
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::The tagged commit must be reachable from origin/main.'
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      app-version: ${{ needs.verify.outputs.version }}
      upload-build: ${{ needs.verify.outputs.prerelease == 'false' }}

  deploy:
    needs: [verify, checks]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        shell: bash
        run: |
          pnpm exec wrangler deploy
          url=$(jq -enr 'first(inputs | select(.type == "deploy") | .targets[0] | strings)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [verify, checks, deploy]
    if: >-
      always() && !cancelled() &&
      needs.verify.result == 'success' && needs.checks.result == 'success' &&
      (needs.deploy.result == 'success' ||
      (needs.verify.outputs.prerelease == 'true' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.url }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false --notes 'Pre-release; not deployed to production.')
          else
            args+=(--notes "Deployed to: $DEPLOYED_URL")
          fi
          gh release create "$TAG" "${args[@]}"
